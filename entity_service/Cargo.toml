[package]
name = "entity_service"
version = "0.1.0"
edition = "2024"

[dependencies]
entity = { path = "../entity" }
kernel = { path = "../kernel" }
runtime = { path = "../runtime" }

# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 数据库
sea-orm = { version = "2.0.0-rc.37", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "macros",
    "schema-sync",
    "entity-registry",
] }
# rusqlite = { version = "0.22.0-beta.0", features = ["bundled"] }
libsqlite3-sys = "0.30"
# 用于加载 SQLite 向量扩展
sqlite-vec = "0.1"
anyhow = "1"

reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

chrono = "0.4.44"
dashmap = "6.1.0"
humantime = "2.1" # 可读时间
