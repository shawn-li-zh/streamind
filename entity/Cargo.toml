[package]
name = "entity"
version = "0.1.0"
edition = "2024"
[lib]
name = "entity"
path = "src/lib.rs"
[dependencies]
sea-orm = { version = "2.0.0-rc.37", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "macros",
] }
# 用于加载 SQLite 向量扩展
sqlite-vec = "0.1" 
chrono = "0.4.44"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
