[package]
name = "rule_script"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3"


# 错误处理
anyhow = { version = "1", features = ["std"] }
thiserror = "2.0.18"
# 数据库

# 语法解析
pest = "2.8.6"
pest_derive = "2.8.6"

rust_decimal = { version = "1.34", features = ["serde", "maths"] }
regex = "1"
rayon = "1.8"                                                      # 用于并行计算
