[package]
name = "tool_pkg"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
chrono = "0.4.44"
dashmap = "6.1.0"
futures = "0.3"
unicode_reader = "1.0.2"
rand = "0.8"

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
mime_guess = "2.0.5"
nanoid = "0.5.0"
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }
# 可读时间
humantime = "2.1"
# 可读容量单位
bytesize = "1.3"
# 文件内容读写
ropey = "1.6.1"
encoding_rs = "0.8.35"

tool_macro = { path = "../tool_macro" }
kernel = { path = "../../kernel" }
