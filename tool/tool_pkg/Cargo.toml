[package]
name = "tool_pkg"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4.44"
dashmap = "6.1.0"
futures = "0.3"
unicode_reader = "1.0.2"
rand = "0.8"


tracing = "0.1"
# 错误处理
anyhow = { version = "1", features = ["std"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls","stream","multipart"] }
mime_guess = "2.0.5"
nanoid = "0.5.0"
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }
# 可读时间
humantime = "2.1"
# 可读容量单位
bytesize = "1.3"
# 文件内容读写
ropey = "1.6.1"
encoding_rs = "0.8.35"

tool_macro = { path = "../tool_macro" }
kernel = { path = "../../kernel" }
entity = { path = "../../entity" }
runtime = { path = "../../runtime" }
entity_service = { path = "../../entity_service" }
rule_script = { path = "../../rule_script" }
# 浏览器控制
chromiumoxide = "0.9.1"