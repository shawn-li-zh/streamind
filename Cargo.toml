[package]
name = "streamind"
version = "0.1.0"
edition = "2021"
[workspace]
members = [".", "streamind_core", "entity", "tool/tool_macro", "tool/tool_pkg"]
[dependencies]
entity = { path = "entity" }
streamind_core = { path = "streamind_core" }
# tool_core = { path = "tool/tool_core" }
tool_pkg = { path = "tool/tool_pkg" }

async-openai = "0.25"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
schemars = "0.8"
futures = "0.3"
chrono = "0.4.44"
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1.19"
regex = "1"
pest = "2.8.6"
pest_derive = "2.8.6"
rayon = "1.8" # 用于并行计算
notify = "6"
sea-orm = { version = "2.0.0-rc.37", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "macros",
    "schema-sync",
    "entity-registry",
] }
async-trait = "0.1"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
tower-http = { version = "0.5", features = ["cors"] } # 处理跨域
thiserror = "2.0.18"
dashmap = "6.1.0"
rand = "0.8"
[dev-dependencies]
cargo-nextest = "0.9"

[profile.dev]
opt-level = 0 # 确保是 0，表示不优化，保留所有变量信息
debug = true  # 确保生成调试信息
