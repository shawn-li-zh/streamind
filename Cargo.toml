[package]
name = "streamind"
version = "0.1.0"
edition = "2021"

[dependencies]
async-openai = "0.25"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
schemars = "0.8"
futures = "0.3"
chrono = "0.4.44"
[dev-dependencies]
cargo-nextest = "0.9"
