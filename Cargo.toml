[package]
name = "streamind"
version = "0.1.0"
edition = "2021"
[workspace]
members = [
    ".",
    "kernel",
    "entity",
    "tool/tool_macro",
    "tool/tool_pkg",
    "runtime",
    "entity_service",
    "web",
    "reflection", "rule_script",
]
[dependencies]
entity = { path = "entity" }
entity_service = { path = "entity_service" }
kernel = { path = "kernel" }
runtime = { path = "runtime" }
web = { path = "web" }
reflection = { path = "reflection" }
# tool_core = { path = "tool/tool_core" }
tool_pkg = { path = "tool/tool_pkg" }

# ai
async-openai = "0.38.1"
# 锁
parking_lot = "0.12.5"
# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 错误处理
anyhow = { version = "1", features = ["std"] }
thiserror = "2.0.18"
# 数据库


# HTTP 客户端和服务器 web

axum = { version = "0.8.9", features = ["default"] }

# 工具库
dashmap = "6.1.0"
rand = "0.8"
humantime = "2.1" # 可读时间
regex = "1"
chrono = "0.4.44"
dotenvy = "0.15"

# 定时任务
tokio-cron-scheduler = "0.15.1"
uuid ={version = "1",features = ["v4"]}
notify = "6"         # 文件系统监视
scopeguard = "1.2.0"
[dev-dependencies]
cargo-nextest = "0.9"
