[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
futures = "0.3"
tokio-stream = "0.1.18"
async-stream = "0.3.6"
pin-project = "1.0"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

regex = "1"
# 错误处理
anyhow = { version = "1", features = ["std"] }
chrono = "0.4.44"
dashmap = "6.1.0"

tracing = "0.1"
# id生成
nanoid = "0.5.0"
# 可读时间
humantime = "2.1"