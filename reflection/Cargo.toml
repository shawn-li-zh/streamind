[package]
name = "reflection"
version = "0.1.0"
edition = "2024"

[dependencies]
# entity = { path = "../entity" }
# entity_service = { path = "../entity_service" }
rule_script = { path = "../rule_script" }
# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 错误处理
anyhow = { version = "1", features = ["std"] }
thiserror = "2.0.18"

dashmap = "6.1.0"
rust_decimal = { version = "1.34", features = ["serde", "maths"] }
regex = "1"
chrono = "0.4.44"
rayon = "1.8"                                                      # 用于并行计算
