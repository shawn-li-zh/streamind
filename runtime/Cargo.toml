[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
[lib]
name = "runtime"
path = "src/lib.rs"
[dependencies]
kernel = { path = "../kernel" }
# ai
async-openai = { version = "0.38.1", features = [
    "chatkit",
    "image",
    "responses",
    "chat-completion",
    "assistant",
    "byot",
    "embedding",
] }
# 锁
parking_lot = "0.12.5"
# 异步库
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
async_once = "0.2.6"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
futures = "0.3"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误处理
anyhow = { version = "1", features = ["std"] }
# 日志
tracing = "0.1"
# web
axum = { version = "0.8.9", features = ["default"] }
# 定时任务
tokio-cron-scheduler = "0.15.1"
# 网络
reqwest = { version = "0.12", features = ["json", "rustls-tls","stream","multipart"] }
# 工具库
chrono = "0.4.44"
dashmap = "6.1.0"
humantime = "2.1"                           # 可读时间
base64 = "0.22.1"
scopeguard = "1.2.0"
derive_builder = "0.20"
typed-builder = "0.23.2"
uuid = { version = "1", features = ["v4"] }

mime_guess = "2.0.5"